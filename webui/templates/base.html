<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}spotify-slsk{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    .badge { display: inline-block; padding: 0.15em 0.55em; border-radius: 0.3em; font-size: 0.75em; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge-ok        { background: #2ecc71; color: #fff; }
    .badge-pending   { background: #bdc3c7; color: #2c3e50; }
    .badge-suspended { background: #e74c3c; color: #fff; }
    .badge-retrying  { background: #f39c12; color: #fff; }
    .badge-disabled  { background: #7f8c8d; color: #fff; }
    .progress { height: 8px; background: var(--pico-muted-border-color); border-radius: 4px; overflow: hidden; margin: 0.5em 0; }
    .progress-bar { height: 100%; background: #2ecc71; transition: width 0.4s ease; }
    .muted { color: var(--pico-muted-color); font-size: 0.85em; }
    .stat { display: inline-block; margin-right: 1.25em; }
    .flash-success { background: #e8f7ec; border-left: 4px solid #2ecc71; padding: 0.5em 0.75em; margin: 0.5em 0; }
    .flash-error   { background: #fdecea; border-left: 4px solid #e74c3c; padding: 0.5em 0.75em; margin: 0.5em 0; }
    .inline-form { display: inline-block; margin: 0 0.25em 0 0; }
    .inline-form button { padding: 0.35em 0.75em; font-size: 0.85em; margin: 0; }
    table td.tight { white-space: nowrap; }
    .nav-filters a { margin-right: 0.75em; }
    .nav-filters a.active { font-weight: 600; text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><strong><a href="{{ url_for('dashboard') }}">spotify-slsk</a></strong></li>
      </ul>
      <ul>
        <li><a href="{{ url_for('dashboard') }}">Playlists</a></li>
        <li><a href="{{ url_for('settings') }}">Settings</a></li>
        <li><a href="{{ url_for('healthz') }}">Health</a></li>
      </ul>
    </nav>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
