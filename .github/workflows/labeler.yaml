name: "Labeler"

# pull_request_target runs with a write token in the context of the base
# branch, so that it can label PRs from forks. That is only safe because this
# workflow never checks out or executes PR code: actions/labeler reads the
# changed-file list and .github/labeler.yaml (from the base branch) via the API.
# Do not add a checkout of the PR head here.
on:
  pull_request_target:
    branches: ["main"]

permissions: {}

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yaml
