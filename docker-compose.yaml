services:
  spotify-slsk:
    build: .
    #image: ghcr.io/guilhermewolf/spotify-slsk/spotify-slsk:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./downloads:/downloads
      - ./playlists:/playlists
    depends_on:
      slskd:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Override UID/GID via PUID/PGID in .env to match the host user that owns
    # ./data, ./downloads, ./playlists. Defaults to 1000:1000.
    user: "${PUID:-1000}:${PGID:-1000}"

  slskd:
    image: slskd/slskd:0.23.1
    env_file:
      - .env
    volumes:
      - ./downloads:/downloads
      - ./downloads/incomplete:/downloads/incomplete
      - ./slsk_app:/app
    ports:
      - "127.0.0.1:5030:5030"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
