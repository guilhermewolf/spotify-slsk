# Example deployment using the published image. Copy to docker-compose.yaml,
# create a .env from .env-example, and `docker compose up -d`.
services:
  spotify-slsk:
    image: ghcr.io/guilhermewolf/spotify-slsk/spotify-slsk:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./downloads:/downloads
      - ./playlists:/playlists
    ports:
      # The web UI has no login unless UI_AUTH_USERNAME / UI_AUTH_PASSWORD
      # are set: keep it on loopback, set those, or put an authenticating
      # reverse proxy in front.
      - "127.0.0.1:8000:8000"
    depends_on:
      slskd:
        condition: service_started
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"

  slskd:
    # 0.26 renamed/moved config keys - see "Upgrading slskd to 0.26" in README.
    image: slskd/slskd:0.26.1
    env_file:
      - .env
    volumes:
      - ./downloads:/downloads
      - ./downloads/incomplete:/downloads/incomplete
      - ./slsk_app:/app
    ports:
      - "127.0.0.1:5030:5030"
    restart: unless-stopped
